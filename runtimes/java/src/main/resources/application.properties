quarkus.lambda.handler=benchHandler

# Synchroner DynamoDB-Client via URLConnection: kleinstes Native-Image, schnellster Cold Start
quarkus.dynamodb.sync-client.type=url

# Native-Build im Container, keine lokale GraalVM noetig
quarkus.native.container-build=true

# Hot-Path bleibt log-frei
quarkus.log.level=WARN
quarkus.log.category."ch.kisoft.bench".level=WARN

# Lokaler Dev-Mode gegen DynamoDB Local (siehe bench/local/setup.sh)
%dev.quarkus.dynamodb.endpoint-override=http://localhost:8000
%dev.quarkus.dynamodb.aws.credentials.type=static
%dev.quarkus.dynamodb.aws.credentials.static-provider.access-key-id=local
%dev.quarkus.dynamodb.aws.credentials.static-provider.secret-access-key=local
%dev.quarkus.dynamodb.aws.region=us-east-1
